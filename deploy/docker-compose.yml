# traceback-coach :: always-on JupyterLab + Cloudflare named tunnel
# ------------------------------------------------------------------
# Run from the repo root (build context is the repo root):
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Two services:
#   lab         - JupyterLab with the package installed. NO published host ports.
#   cloudflared - Cloudflare named-tunnel connector (sidecar). Outbound-only.
#                 Public hostname is configured in the Cloudflare Zero Trust
#                 dashboard to point at  http://lab:8888  over this compose network.
#
# Secrets come ONLY from deploy/.env (gitignored). See deploy/.env.example.

name: traceback-coach

services:
  lab:
    build:
      # Context = repo root so `pip install .` / pyproject.toml are visible.
      # A repo-root .dockerignore keeps deploy/.env, .git and .venv OUT of this context.
      context: ..
      dockerfile: deploy/Dockerfile
    image: traceback-coach-lab:latest
    container_name: traceback-coach-lab
    restart: unless-stopped
    # No `ports:` block on purpose — the host exposes nothing.
    # cloudflared reaches this service by its name on the shared network.
    expose:
      - "8888"
    environment:
      # Hashed argon2id password (NOT the plaintext). Required — fail fast if unset.
      JUPYTER_PASSWORD_HASH: ${JUPYTER_PASSWORD_HASH:?set JUPYTER_PASSWORD_HASH in deploy/.env}
      # Public hostname served by the tunnel, e.g. lab.example.com. Required so the
      # Jupyter origin/CSP lock is applied (the config fails closed without it).
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME in deploy/.env}
      NB_WORKDIR: /home/coach/work
    volumes:
      # Persist notebooks/work across rebuilds.
      - notebooks:/home/coach/work
    networks:
      - edge
    # Container hardening.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          memory: 512m
    # Compose (non-swarm) also honours these top-level shortcuts:
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512

  cloudflared:
    # Pinned (NOT :latest) for deterministic, auditable deploys. Bump deliberately.
    image: cloudflare/cloudflared:2024.12.2
    container_name: traceback-coach-tunnel
    restart: unless-stopped
    # Token-based named tunnel (modern connector). The token encodes which
    # tunnel + account this connector joins; ingress (lab.<domain> -> http://lab:8888)
    # is configured in the Cloudflare Zero Trust dashboard, not here.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in deploy/.env}
      # Metrics/health endpoint, bound only inside the container (compose net).
      TUNNEL_METRICS: "127.0.0.1:2000"
    depends_on:
      lab:
        condition: service_started
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  edge:
    driver: bridge
    internal: false   # cloudflared needs OUTBOUND internet; it never accepts inbound.

volumes:
  notebooks:
    driver: local
